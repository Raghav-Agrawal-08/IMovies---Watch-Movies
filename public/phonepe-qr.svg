<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="100%" height="100%">
  <defs>
    <linearGradient id="phonepeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5f259f" />
      <stop offset="100%" stop-color="#3d126f" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="10" y="10" width="380" height="500" rx="24" fill="#ffffff" filter="url(#cardShadow)"/>

  <!-- PhonePe Top Banner -->
  <path d="M 10 34 Q 10 10 34 10 L 366 10 Q 390 10 390 34 L 390 100 L 10 100 Z" fill="url(#phonepeGrad)" />

  <!-- PhonePe Circle Logo -->
  <circle cx="65" cy="55" r="30" fill="#ffffff" />
  <!-- Stylized Pe symbol -->
  <path d="M 52 42 L 67 42 C 73 42 77 45 77 50 C 77 55 73 58 67 58 L 59 58 L 59 70 L 52 70 Z M 59 47 L 59 53 L 66 53 C 69 53 71 52 71 50 C 71 48 69 47 66 47 Z" fill="#5f259f" />
  <rect x="71" y="44" width="7" height="3" rx="1.5" fill="#5f259f" transform="rotate(45 71 44)"/>

  <!-- Brand Text -->
  <text x="110" y="52" fill="#ffffff" font-family="'Inter', system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="0.5">PhonePe</text>
  <text x="110" y="74" fill="#d8b4fe" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">ACCEPTED HERE</text>

  <!-- Merchant Name Box -->
  <rect x="30" y="115" width="340" height="42" rx="10" fill="#f5f3ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="200" y="134" fill="#4c1d95" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">IMOVIES ENTERTAINMENT</text>
  <text x="200" y="148" fill="#6b7280" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="500" text-anchor="middle">UPI ID: imovies.ticket@phonepe</text>

  <!-- QR Code Container -->
  <rect x="55" y="170" width="290" height="250" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Stylized QR Code Graphic -->
  <!-- Corner Position Finder 1 (Top-Left) -->
  <rect x="80" y="195" width="60" height="60" rx="6" fill="#000000"/>
  <rect x="88" y="203" width="44" height="44" rx="4" fill="#ffffff"/>
  <rect x="96" y="211" width="28" height="28" rx="2" fill="#5f259f"/>

  <!-- Corner Position Finder 2 (Top-Right) -->
  <rect x="260" y="195" width="60" height="60" rx="6" fill="#000000"/>
  <rect x="268" y="203" width="44" height="44" rx="4" fill="#ffffff"/>
  <rect x="276" y="211" width="28" height="28" rx="2" fill="#5f259f"/>

  <!-- Corner Position Finder 3 (Bottom-Left) -->
  <rect x="80" y="340" width="60" height="60" rx="6" fill="#000000"/>
  <rect x="88" y="348" width="44" height="44" rx="4" fill="#ffffff"/>
  <rect x="96" y="356" width="28" height="28" rx="2" fill="#5f259f"/>

  <!-- Alignment Pattern Center-Right -->
  <rect x="270" y="350" width="35" height="35" rx="4" fill="#000000"/>
  <rect x="276" y="356" width="23" height="23" rx="2" fill="#ffffff"/>
  <rect x="282" y="362" width="11" height="11" rx="1" fill="#5f259f"/>

  <!-- Timing Patterns -->
  <rect x="150" y="222" width="10" height="6" fill="#1f2937"/>
  <rect x="170" y="222" width="10" height="6" fill="#1f2937"/>
  <rect x="190" y="222" width="10" height="6" fill="#1f2937"/>
  <rect x="210" y="222" width="10" height="6" fill="#1f2937"/>
  <rect x="230" y="222" width="10" height="6" fill="#1f2937"/>

  <!-- Data Matrix Dots / Modules -->
  <!-- Row 1 -->
  <rect x="150" y="195" width="12" height="12" rx="2" fill="#1f2937"/>
  <rect x="180" y="195" width="24" height="12" rx="2" fill="#1f2937"/>
  <rect x="220" y="195" width="12" height="24" rx="2" fill="#1f2937"/>

  <!-- Center Grouping -->
  <rect x="160" y="245" width="20" height="20" rx="3" fill="#1f2937"/>
  <rect x="190" y="240" width="30" height="12" rx="2" fill="#1f2937"/>
  <rect x="230" y="245" width="14" height="28" rx="2" fill="#1f2937"/>
  <rect x="160" y="280" width="30" height="14" rx="2" fill="#1f2937"/>
  <rect x="205" y="270" width="15" height="35" rx="2" fill="#1f2937"/>
  <rect x="235" y="290" width="20" height="20" rx="3" fill="#1f2937"/>
  <rect x="150" y="315" width="40" height="12" rx="2" fill="#1f2937"/>
  <rect x="200" y="320" width="25" height="25" rx="3" fill="#1f2937"/>
  <rect x="240" y="330" width="18" height="18" rx="2" fill="#1f2937"/>

  <!-- Bottom Grouping -->
  <rect x="155" y="355" width="25" height="15" rx="2" fill="#1f2937"/>
  <rect x="190" y="360" width="35" height="14" rx="2" fill="#1f2937"/>
  <rect x="160" y="380" width="18" height="18" rx="2" fill="#1f2937"/>
  <rect x="210" y="385" width="30" height="14" rx="2" fill="#1f2937"/>

  <!-- Center PhonePe Mini Badge inside QR -->
  <circle cx="200" cy="295" r="22" fill="#ffffff" stroke="#5f259f" stroke-width="2"/>
  <circle cx="200" cy="295" r="18" fill="#5f259f"/>
  <path d="M 193 287 L 202 287 C 205 287 208 289 208 292 C 208 295 205 297 202 297 L 197 297 L 197 304 L 193 304 Z M 197 290 L 197 294 L 201 294 C 203 294 204 293 204 292 C 204 291 203 290 201 290 Z" fill="#ffffff" />

  <!-- Scan & Pay with Any UPI app footer -->
  <text x="200" y="445" fill="#374151" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Scan &amp; Pay using any UPI App</text>
  
  <g transform="translate(110, 458)">
    <!-- Mini icons text badges -->
    <rect x="0" y="0" width="40" height="18" rx="4" fill="#f3f4f6"/>
    <text x="20" y="13" fill="#1f2937" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">GPay</text>
    
    <rect x="48" y="0" width="42" height="18" rx="4" fill="#f3f4f6"/>
    <text x="69" y="13" fill="#0284c7" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Paytm</text>

    <rect x="98" y="0" width="40" height="18" rx="4" fill="#f3f4f6"/>
    <text x="118" y="13" fill="#5f259f" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">PhonePe</text>

    <rect x="146" y="0" width="38" height="18" rx="4" fill="#f3f4f6"/>
    <text x="165" y="13" fill="#ea580c" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">BHIM</text>
  </g>

  <!-- Bottom Notice Strip -->
  <rect x="25" y="488" width="350" height="18" rx="6" fill="#fef2f2"/>
  <text x="200" y="501" fill="#b91c1c" font-family="'Inter', system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">⚠ Static QR: Enter 12-digit UTR below after paying to verify</text>
</svg>
